
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crafted Heaven | Seller Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f4ef;
      color: #3f3a35;
    }

    .login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 30px 24px;
      border-radius: 24px;
      box-shadow: 0 10px 35px rgba(0,0,0,.08);
      text-align: center;
    }

    .logo {
      font-size: 30px;
      font-weight: 700;
      color: #6c7b55;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #888;
      margin-bottom: 25px;
    }

    input, textarea, select {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #ddd7cf;
      border-radius: 12px;
      margin-top: 7px;
      margin-bottom: 15px;
      font-size: 15px;
      background: #fff;
      outline: none;
    }

    input:focus, textarea:focus, select:focus {
      border-color: #8b9a70;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    label {
      display: block;
      text-align: left;
      font-weight: 600;
      font-size: 14px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
    }

    .primary {
      background: #71815b;
      color: white;
      width: 100%;
    }

    .primary:hover {
      background: #5f704b;
    }

    .dashboard {
      display: none;
      min-height: 100vh;
    }

    header {
      background: white;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 12px rgba(0,0,0,.05);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      color: #667650;
      font-size: 21px;
    }

    .logout {
      background: #eee8df;
      color: #555;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 22px 16px 50px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .topbar h2 {
      font-size: 24px;
    }

    .add-btn {
      background: #71815b;
      color: white;
    }

    .form-card {
      display: none;
      background: white;
      border-radius: 20px;
      padding: 22px;
      margin-bottom: 25px;
      box-shadow: 0 5px 20px rgba(0,0,0,.06);
    }

    .form-title {
      margin-bottom: 18px;
      color: #687852;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0 15px;
    }

    .full {
      grid-column: 1 / -1;
    }

    .check-row {
      display: flex;
      gap: 25px;
      margin: 5px 0 18px;
      flex-wrap: wrap;
    }

    .check-row label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 500;
    }

    .check-row input {
      width: auto;
      margin: 0;
    }

    .form-buttons {
      display: flex;
      gap: 10px;
      margin-top: 5px;
    }

    .save {
      background: #71815b;
      color: white;
      flex: 1;
    }

    .cancel {
      background: #eee8df;
      color: #555;
      flex: 1;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .product-card {
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 5px 18px rgba(0,0,0,.06);
    }

    .product-card img {
      width: 100%;
      height: 190px;
      object-fit: cover;
      background: #f1eee9;
    }

    .product-info {
      padding: 15px;
    }

    .product-info h3 {
      font-size: 17px;
      margin-bottom: 7px;
    }

    .category {
      font-size: 12px;
      color: #888;
      margin-bottom: 9px;
    }

    .price {
      font-size: 18px;
      font-weight: 700;
      color: #667650;
    }

    .old-price {
      color: #aaa;
      text-decoration: line-through;
      font-size: 13px;
      margin-left: 5px;
    }

    .stock {
      margin-top: 7px;
      font-size: 13px;
    }

    .status {
      display: inline-block;
      margin-top: 8px;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 11px;
      background: #e8efe1;
      color: #587043;
    }

    .status.off {
      background: #f3e4e1;
      color: #a15d50;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 13px;
    }

    .edit {
      background: #e9eee3;
      color: #586747;
      flex: 1;
    }

    .delete {
      background: #f5e2df;
      color: #a25549;
      flex: 1;
    }

    .empty {
      background: white;
      padding: 40px 20px;
      border-radius: 18px;
      text-align: center;
      color: #888;
      grid-column: 1 / -1;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 15px;
      font-size: 14px;
    }

    .error {
      background: #f8e3e0;
      color: #9a4f44;
    }

    .success {
      background: #e5efdc;
      color: #557044;
    }

    .upload-note {
      color: #888;
      font-size: 12px;
      margin-top: -8px;
      margin-bottom: 15px;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #888;
      grid-column: 1 / -1;
    }

    @media(max-width: 800px) {
      .products {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media(max-width: 600px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

      .products {
        grid-template-columns: 1fr;
      }

      .product-card img {
        height: 220px;
      }

      header h1 {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

<!-- LOGIN -->
<section class="login-screen" id="loginScreen">
  <div class="login-box">
    <div class="logo">Crafted Heaven</div>
    <div class="subtitle">Seller Dashboard</div>

    <div id="loginError" class="message error"></div>

    <label>Email</label>
    <input type="email" id="email" placeholder="Your seller email">

    <label>Password</label>
    <input type="password" id="password" placeholder="Your password">

    <button class="primary" onclick="login()">Login to Dashboard</button>
  </div>
</section>


<!-- DASHBOARD -->
<section class="dashboard" id="dashboard">

  <header>
    <h1>🌿 Crafted Heaven</h1>
    <button class="logout" onclick="logout()">Logout</button>
  </header>

  <div class="container">

    <div class="topbar">
      <h2>My Products</h2>
      <button class="add-btn" onclick="showForm()">＋ Add Product</button>
    </div>

    <div id="message" class="message"></div>

    <!-- PRODUCT FORM -->
    <div class="form-card" id="productForm">

      <h2 class="form-title" id="formTitle">Add New Product</h2>

      <input type="hidden" id="productId">

      <div class="grid">

        <div>
          <label>Product Name</label>
          <input id="name" type="text" placeholder="e.g. Donut Keychain">
        </div>

        <div>
          <label>Category</label>
          <select id="category">
            <option value="">Select Category</option>
            <option value="Live Plants">Live Plants</option>
            <option value="Gardening">Gardening</option>
            <option value="Handmade Crafts">Handmade Crafts</option>
            <option value="Crochet">Crochet</option>
            <option value="Keychains">Keychains</option>
            <option value="Kids">Kids</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div>
          <label>Price</label>
          <input id="price" type="number" placeholder="300">
        </div>

        <div>
          <label>Sale Price</label>
          <input id="sale_price" type="number" placeholder="250">
        </div>

        <div>
          <label>Stock</label>
          <input id="stock" type="number" value="1" min="0">
        </div>

        <div>
          <label>Badge</label>
          <input id="badge" type="text" placeholder="New / Sale / Best Seller">
        </div>

        <div class="full">
          <label>Short Description</label>
          <textarea id="short_description" placeholder="Short product description..."></textarea>
        </div>

        <div class="full">
          <label>Highlights</label>
          <textarea id="highlights" placeholder="Example:&#10;Premium quality&#10;Beautiful design&#10;Perfect gift"></textarea>
        </div>

        <div>
          <label>Status</label>
          <select id="status">
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
          </select>
        </div>

        <div class="check-row">
          <label>
            <input type="checkbox" id="featured">
            Featured Product
          </label>
        </div>

        <div class="full">
          <label>Product Image 1</label>
          <input type="file" id="image1" accept="image/*">
          <div class="upload-note">Main product image</div>

          <label>Product Image 2</label>
          <input type="file" id="image2" accept="image/*">

          <label>Product Image 3</label>
          <input type="file" id="image3" accept="image/*">
        </div>

      </div>

      <div class="form-buttons">
        <button class="save" onclick="saveProduct()">Save Product</button>
        <button class="cancel" onclick="hideForm()">Cancel</button>
      </div>

    </div>

    <!-- PRODUCTS -->
    <div class="products" id="productsList">
      <div class="loading">Loading products...</div>
    </div>

  </div>
</section>


<script>

  // ==============================
  // SUPABASE CONNECTION
  // ==============================

  const SUPABASE_URL = "https://qyiohberbkudtuolpmyd.supabase.co";

  const SUPABASE_KEY = "sb_publishable_RdTzt951O8A8ipMDS87siA_tf_SLjeR";

  const { createClient } = supabase;

  const db = createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


  // ==============================
  // LOGIN
  // ==============================

  async function login() {

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!email || !password) {
      showLoginError("Please enter email and password.");
      return;
    }

    const { data, error } = await db.auth.signInWithPassword({
      email: email,
      password: password
    });

    if (error) {
      showLoginError(error.message);
      return;
    }

    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("dashboard").style.display = "block";

    loadProducts();
  }


  function showLoginError(message) {
    const box = document.getElementById("loginError");
    box.textContent = message;
    box.style.display = "block";
  }


  // ==============================
  // LOGOUT
  // ==============================

  async function logout() {

    await db.auth.signOut();

    document.getElementById("dashboard").style.display = "none";
    document.getElementById("loginScreen").style.display = "flex";
  }


  // ==============================
  // CHECK LOGIN
  // ==============================

  async function checkUser() {

    const { data } = await db.auth.getSession();

    if (data.session) {

      document.getElementById("loginScreen").style.display = "none";
      document.getElementById("dashboard").style.display = "block";

      loadProducts();
    }
  }


  // ==============================
  // LOAD PRODUCTS
  // ==============================

  async function loadProducts() {

    const list = document.getElementById("productsList");

    list.innerHTML = '<div class="loading">Loading products...</div>';

    const { data, error } = await db
      .from("products")
      .select("*")
      .order("created_at", { ascending: false });

    if (error) {

      list.innerHTML =
        '<div class="empty">Error loading products.<br>' +
        error.message +
        '</div>';

      return;
    }

    if (!data || data.length === 0) {

      list.innerHTML =
        '<div class="empty">🌿 No products yet.<br><br>Tap "Add Product" to add your first product.</div>';

      return;
    }

    list.innerHTML = "";

    data.forEach(product => {

      const image =
        product.image_url ||
        "https://via.placeholder.com/500x400?text=Crafted+Heaven";

      const salePrice =
        product.sale_price &&
        Number(product.sale_price) > 0
          ? `<span class="price">Rs. ${product.sale_price}</span>
             <span class="old-price">Rs. ${product.price}</span>`
          : `<span class="price">Rs. ${product.price}</span>`;

      const statusClass =
        product.status === "active" ? "" : "off";

      const statusText =
        product.status === "active" ? "Active" : "Inactive";

      list.innerHTML += `

        <div class="product-card">

          <img src="${escapeHTML(image)}" alt="${escapeHTML(product.name || "Product")}">

          <div class="product-info">

            <h3>${escapeHTML(product.name || "Unnamed Product")}</h3>

            <div class="category">
              ${escapeHTML(product.category || "Other")}
            </div>

            <div>
              ${salePrice}
            </div>

            <div class="stock">
              📦 Stock: ${product.stock ?? 0}
            </div>

            <span class="status ${statusClass}">
              ${statusText}
            </span>

            <div class="actions">
              <button class="edit" onclick='editProduct(${JSON.stringify(product)})'>
                ✏️ Edit
              </button>

              <button class="delete" onclick="deleteProduct('${product.id}')">
                🗑️ Delete
              </button>
            </div>

          </div>

        </div>
      `;
    });
  }


  // ==============================
  // SHOW FORM
  // ==============================

  function showForm() {

    document.getElementById("productForm").style.display = "block";

    document.getElementById("formTitle").textContent =
      "Add New Product";

    clearForm();

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  }


  function hideForm() {

    document.getElementById("productForm").style.display = "none";

    clearForm();
  }


  function clearForm() {

    document.getElementById("productId").value = "";
    document.getElementById("name").value = "";
    document.getElementById("category").value = "";
    document.getElementById("price").value = "";
    document.getElementById("sale_price").value = "";
    document.getElementById("stock").value = "1";
    document.getElementById("badge").value = "";
    document.getElementById("short_description").value = "";
    document.getElementById("highlights").value = "";
    document.getElementById("status").value = "active";
    document.getElementById("featured").checked = false;

    document.getElementById("image1").value = "";
    document.getElementById("image2").value = "";
    document.getElementById("image3").value = "";
  }


  // ==============================
  // EDIT PRODUCT
  // ==============================

  function editProduct(product) {

    document.getElementById("productForm").style.display = "block";

    document.getElementById("formTitle").textContent =
      "Edit Product";

    document.getElementById("productId").value =
      product.id || "";

    document.getElementById("name").value =
      product.name || "";

    document.getElementById("category").value =
      product.category || "";

    document.getElementById("price").value =
      product.price || "";

    document.getElementById("sale_price").value =
      product.sale_price || "";

    document.getElementById("stock").value =
      product.stock ?? 0;

    document.getElementById("badge").value =
      product.badge || "";

    document.getElementById("short_description").value =
      product.short_description || "";

    document.getElementById("highlights").value =
      product.highlights || "";

    document.getElementById("status").value =
      product.status || "active";

    document.getElementById("featured").checked =
      product.featured === true;

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  }


  // ==============================
  // SAVE PRODUCT
  // ==============================

  async function saveProduct() {

    const id =
      document.getElementById("productId").value;

    const name =
      document.getElementById("name").value.trim();

    const category =
      document.getElementById("category").value;

    const price =
      Number(document.getElementById("price").value);

    const salePriceValue =
      document.getElementById("sale_price").value;

    const sale_price =
      salePriceValue ? Number(salePriceValue) : null;

    const stock =
      Number(document.getElementById("stock").value);

    const badge =
      document.getElementById("badge").value.trim();

    const short_description =
      document.getElementById("short_description").value.trim();

    const highlights =
      document.getElementById("highlights").value.trim();

    const status =
      document.getElementById("status").value;

    const featured =
      document.getElementById("featured").checked;


    if (!name) {
      showMessage("Please enter product name.", true);
      return;
    }

    if (!price || price <= 0) {
      showMessage("Please enter a valid price.", true);
      return;
    }


    showMessage("Saving product...");


    try {

      let image_url = null;
      let image_url_2 = null;
      let image_url_3 = null;


      // Upload image 1
      const file1 =
        document.getElementById("image1").files[0];

      if (file1) {
        image_url = await uploadImage(file1);
      }


      // Upload image 2
      const file2 =
        document.getElementById("image2").files[0];

      if (file2) {
        image_url_2 = await uploadImage(file2);
      }


      // Upload image 3
      const file3 =
        document.getElementById("image3").files[0];

      if (file3) {
        image_url_3 = await uploadImage(file3);
      }


      const slug =
        createSlug(name) + "-" + Date.now();


      const productData = {

        name: name,

        slug: slug,

        category: category,

        price: price,

        sale_price: sale_price,

        stock: stock,

        short_description: short_description,

        highlights: highlights,

        badge: badge,

        featured: featured,

        status: status

      };


      // Only replace image fields when new images were selected
      if (image_url) {
        productData.image_url = image_url;
      }

      if (image_url_2) {
        productData.image_url_2 = image_url_2;
      }

      if (image_url_3) {
        productData.image_url_3 = image_url_3;
      }


      let result;


      if (id) {

        result = await db
          .from("products")
          .update(productData)
          .eq("id", id);

      } else {

        result = await db
          .from("products")
          .insert(productData);

      }


      if (result.error) {
        throw result.error;
      }


      showMessage(
        id
          ? "Product updated successfully! ✅"
          : "Product added successfully! ✅"
      );


      hideForm();

      await loadProducts();


    } catch (error) {

      showMessage(
        "Error: " + error.message,
        true
      );

    }
  }


  // ==============================
  // IMAGE UPLOAD
  // ==============================

  async function uploadImage(file) {

    const extension =
      file.name.split(".").pop();

    const fileName =
      Date.now() +
      "-" +
      Math.random().toString(36).substring(2) +
      "." +
      extension;


    const filePath =
      "products/" + fileName;


    const { error } =
      await db.storage
        .from("product-images")
        .upload(filePath, file, {
          cacheControl: "3600",
          upsert: false
        });


    if (error) {
      throw error;
    }


    const { data } =
      db.storage
        .from("product-images")
        .getPublicUrl(filePath);


    return data.publicUrl;
  }


  // ==============================
  // DELETE PRODUCT
  // ==============================

  async function deleteProduct(id) {

    const confirmDelete =
      confirm(
        "Are you sure you want to delete this product?"
      );

    if (!confirmDelete) {
      return;
    }


    const { error } =
      await db
        .from("products")
        .delete()
        .eq("id", id);


    if (error) {

      showMessage(
        "Delete failed: " + error.message,
        true
      );

      return;
    }


    showMessage(
      "Product deleted successfully! ✅"
    );

    loadProducts();
  }


  // ==============================
  // MESSAGE
  // ==============================

  function showMessage(message, error = false) {

    const box =
      document.getElementById("message");

    box.textContent = message;

    box.className =
      "message " +
      (error ? "error" : "success");

    box.style.display = "block";


    setTimeout(() => {

      box.style.display = "none";

    }, 4000);
  }


  // ==============================
  // SLUG
  // ==============================

  function createSlug(text) {

    return text
      .toLowerCase()
      .trim()
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/^-+|-+$/g, "");
  }


  // ==============================
  // BASIC HTML SAFETY
  // ==============================

  function escapeHTML(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  // ==============================
  // START
  // ==============================

  checkUser();

</script>

</body>
  </html>
